name: 学科試験 空位检查

on:
  schedule:
    - cron: "*/10 * * * *"   # 约每 10 分钟一次（GitHub 的定时可能有延迟）
  workflow_dispatch:          # 允许在 Actions 页面手动运行

permissions:
  contents: read

concurrency:
  group: menkyo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 读取上一次的状态
        uses: actions/cache/restore@v4
        with:
          path: state
          key: menkyo-state-${{ github.run_id }}
          restore-keys: menkyo-state-

      - name: 检查空位
        env:
          TZ: Asia/Tokyo
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COURSE_CODE: ${{ vars.COURSE_CODE }}
          MENKYO_STATE_FILE: state/menkyo_state.json
          MENKYO_STRICT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          mkdir -p state
          python3 menkyo_checker.py --once

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: menkyo-state-${{ github.run_id }}
