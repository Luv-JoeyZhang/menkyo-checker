name: 学科試験 空位检查

on:
  schedule:
    - cron: "3-59/10 * * * *"   # 每小时的 03、13、23…分，约每 10 分钟一次（避开整点高峰；GitHub 的定时可能有延迟）
  push:
    paths:
      - ".github/test-notify"  # 改动这个文件 = 发一条测试提醒
  workflow_dispatch:          # 允许在 Actions 页面手动运行
    inputs:
      test_notify:
        description: "发一条测试提醒（确认手机能收到通知）"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: menkyo-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 读取上一次的状态
        uses: actions/cache/restore@v4
        with:
          path: state
          key: menkyo-state-${{ github.run_id }}
          restore-keys: menkyo-state-

      - name: 检查空位
        env:
          TZ: Asia/Tokyo
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COURSE_CODE: ${{ vars.COURSE_CODE }}
          MENKYO_STATE_FILE: state/menkyo_state.json
          MENKYO_NOTIFY_FILE: notify.md
          MENKYO_STRICT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          mkdir -p state
          python3 menkyo_checker.py --once

      - name: 测试提醒
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test_notify)
        run: printf '**这是一条测试提醒**\n\n如果手机收到了推送，说明通知正常 ✅ 这个 Issue 可以直接关闭。\n\n' >> notify.md

      - name: 通过 GitHub 提醒（新建 Issue 并 @ 仓库主人）
        if: hashFiles('notify.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: Asia/Tokyo
        run: |
          {
            cat notify.md
            echo "👉 预约网站: https://license-test.tokyo-madoguchi-yoyaku.com/police-pref-tokyo/index.html"
            echo
            echo "@${{ github.repository_owner }}"
          } > body.md
          gh issue create --repo "${{ github.repository }}" \
            --title "🔔 学科試験 有空位 $(date '+%m/%d %H:%M')" \
            --assignee "${{ github.repository_owner }}" \
            --body-file body.md

      - name: 保存状态
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: menkyo-state-${{ github.run_id }}
